# 商家顯示名稱別名：keyword 出現在銀行原始商家字串（merchant_raw）內，就把
# 顯示名稱（merchant_norm）改成 name。比對不分大小寫/全半形，由上而下取第一個命中。
# 加 replace: true 則只替換名稱裡的 keyword、保留其餘部分（如店名）。
# 只影響顯示；分類仍看 categories.yaml。改完跑 `mailquill rebuild` 生效。
